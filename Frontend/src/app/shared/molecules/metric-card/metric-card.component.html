<div class="glass-panel p-6 flex flex-col gap-3 h-full metric-card">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm text-white/60">{{ label }}</p>
      <h3 class="text-2xl font-semibold">{{ value }}</h3>
    </div>
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-primary/20 to-brand-secondary/20 flex items-center justify-center metric-card__icon">
      <img *ngIf="icon" [src]="getIconPath(icon)" class="w-5 h-5 text-brand-primary" [alt]="icon" />
    </div>
  </div>
  <p
    class="text-sm font-medium metric-card__trend"
    [class.metric-card__trend--up]="trend === 'up'"
    [class.metric-card__trend--down]="trend === 'down'"
    [class.metric-card__trend--neutral]="trend === 'neutral'"
  >
    {{ changeLabel }}
  </p>
</div>
