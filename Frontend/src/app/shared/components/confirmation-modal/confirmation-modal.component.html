<!-- Modal de Confirmación Personalizado -->
<div *ngIf="isVisible && data" class="fixed inset-0 z-[60] flex items-center justify-center">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" (click)="onClose()"></div>
  
  <!-- Modal Container -->
  <div class="relative w-full max-w-md mx-4 transform transition-all duration-300 scale-100">
    <div class="bg-gray-900 border border-white/10 rounded-2xl shadow-2xl overflow-hidden">
      
      <!-- Header -->
      <div class="relative p-6 pb-4 border-b border-white/10">
        <div class="flex items-center gap-4">
          <div [class]="'w-12 h-12 rounded-full flex items-center justify-center text-2xl ' + getModalColorClass()">
            {{ modalIcon }}
          </div>
          <div class="flex-1">
            <h3 class="text-xl font-bold text-white">{{ data.title }}</h3>
            <p class="text-white/60 text-sm mt-1">{{ data.message }}</p>
          </div>
        </div>
        
        <!-- Close Button -->
        <button 
          class="absolute top-4 right-4 p-2 text-white/60 hover:text-white hover:bg-white/10 rounded-lg transition-colors"
          (click)="onClose()"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Body -->
      <div class="p-6 pb-4">
        <!-- Details -->
        <div *ngIf="data.details && data.details.length > 0" class="mb-4">
          <div class="bg-gray-800/50 rounded-lg p-4 border border-white/5">
            <div class="text-white/80 text-sm font-medium mb-2">Detalles:</div>
            <div class="space-y-2">
              <div *ngFor="let detail of data.details" class="flex justify-between items-center">
                <span class="text-white/60 text-sm">{{ detail.label }}:</span>
                <span class="text-white font-medium text-sm">{{ detail.value }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Text Confirmation (for delete) -->
        <div *ngIf="data.requireTextConfirmation" class="mb-4">
          <div class="bg-red-500/10 border border-red-500/20 rounded-lg p-4">
            <div class="text-red-400 text-sm font-medium mb-2">
              ⚠️ Esta acción no se puede deshacer
            </div>
            <div class="text-white/80 text-sm mb-3">
              Para confirmar, escribe exactamente: <span class="font-mono bg-red-500/20 px-2 py-1 rounded">{{ data.textConfirmationValue }}</span>
            </div>
            <input 
              type="text" 
              [(ngModel)]="textConfirmation"
              class="w-full px-4 py-2 bg-gray-800/50 border border-white/20 rounded-lg text-white placeholder-white/40 focus:outline-none focus:border-red-500 focus:bg-gray-800/70"
              [placeholder]="getConfirmationPlaceholder()"
            >
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="p-6 pt-4 border-t border-white/10">
        <div class="flex gap-3">
          <!-- Cancel Button -->
          <button 
            class="flex-1 px-4 py-3 bg-gray-700/50 text-white rounded-lg hover:bg-gray-700 transition-colors border border-white/10"
            (click)="onCancel()"
            [disabled]="isConfirming"
          >
            {{ cancelButtonText }}
          </button>
          
          <!-- Confirm Button -->
          <button 
            class="flex-1 px-4 py-3 text-white rounded-lg transition-all duration-300 border"
            [class]="getConfirmButtonClass()"
            (click)="onConfirm()"
            [disabled]="!canConfirm || isConfirming"
          >
            <span *ngIf="!isConfirming">{{ confirmButtonText }}</span>
            <span *ngIf="isConfirming" class="flex items-center justify-center gap-2">
              <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
              Procesando...
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
